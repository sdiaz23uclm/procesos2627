<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS - Gestión de Usuarios</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .vista { display: none; }
        .activa { display: block; }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--error-color);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .aviso { padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; }
        .aviso.ok { background: #dcfce7; color: #166534; }
        .aviso.ko { background: #fee2e2; color: #991b1b; }

        .btn-google {
            background-color: #ffffff;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google:hover { background-color: #f1f5f9; }

        .error { color: var(--error-color); font-size: 0.875rem; margin-top: 8px; }
        .success { color: var(--success-color); font-size: 0.875rem; margin-top: 8px; }

        .divider {
            margin: 24px 0;
            border: none;
            border-top: 1px solid var(--border-color);
        }

        /* Panel de administración y dashboard */
        .dashboard-card {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.875rem;
        }

        th, td {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <header>
        <h1>CloudSaaS Platform</h1>
        <p class="subtitle">Gestión avanzada de usuarios y arquitectura en capas</p>
    </header>

    <div class="container">
        <!-- VISTA DE LOGIN Y REGISTRO -->
        <div id="auth-view" class="vista activa">
            <p id="confirmacion-msg" style="display: none;"></p>
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit">Entrar a la plataforma</button>
            </form>
            <button type="button" id="google-btn" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
                Entrar con Google
            </button>
            <p id="login-error" class="error"></p>
            <button type="button" id="reenviar-btn" style="display: none; background-color: #0284c7;">Reenviar correo de confirmación</button>
            <p id="reenviar-msg" class="success"></p>

            <hr class="divider">

            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <p id="reg-error" class="error"></p>
            <p id="reg-success" class="success"></p>
        </div>

        <!-- VISTA DEL PANEL PRIVADO -->
        <div id="dashboard-view" class="vista">
            <h2>Panel de Control</h2>
            <div class="dashboard-card">
                <p><strong>Usuario:</strong> <span id="user-email"></span></p>
                <p><strong>Rol:</strong> <span id="user-role" style="text-transform: uppercase; font-weight: bold; color: var(--primary);"></span></p>
            </div>

            <!-- Sección exclusiva para administradores (el servidor también lo comprueba) -->
            <div id="admin-section" style="display: none; margin-top: 20px;">
                <h3>Panel de Administración</h3>
                <button id="load-users-btn" style="background-color: #0284c7;">Listar Usuarios del Sistema</button>
                <div id="users-container" style="overflow-x: auto;"></div>

                <form id="activo-form" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="activo-email">Comprobar si un usuario está activo</label>
                        <input type="email" id="activo-email" required placeholder="usuario@email.com">
                    </div>
                    <button type="submit" style="background-color: #0284c7;">Comprobar</button>
                </form>
                <p id="activo-resultado"></p>
                <p id="admin-msg"></p>
            </div>

            <button id="logout-btn" style="margin-top: 20px;">Cerrar Sesión</button>
            <button id="delete-self-btn" class="btn-danger">Eliminar mi cuenta</button>
            <p id="dashboard-error" class="error"></p>
        </div>
    </div>

    <!-- Importamos el cliente de comunicación -->
    <script src="rest.js"></script>
    <script>
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const userEmailSpan = document.getElementById('user-email');
        const userRoleSpan = document.getElementById('user-role');
        const adminSection = document.getElementById('admin-section');

        function mostrarVista(vista) {
            authView.classList.remove('activa');
            dashboardView.classList.remove('activa');
            vista.classList.add('activa');
        }

        async function verificarSesionInicial() {
            try {
                const usuario = await RestClient.comprobarSesion();
                if (usuario) {
                    userEmailSpan.textContent = usuario.email;
                    userRoleSpan.textContent = usuario.rol;
                    if (usuario.rol === 'admin') {
                        adminSection.style.display = 'block';
                    }
                    mostrarVista(dashboardView);
                } else {
                    mostrarVista(authView);
                }
            } catch (e) {
                mostrarVista(authView);
            }
        }

        // Avisos que llegan por la URL tras una redirección del servidor:
        //  /api/confirmar -> /?confirmacion=...   y   /api/auth/google/callback -> /?oauth=...
        function mostrarResultadoConfirmacion() {
            const params = new URLSearchParams(window.location.search);
            const avisos = {
                confirmacion: {
                    ok: ['ok', 'Cuenta confirmada. Ya puedes iniciar sesión.'],
                    caducado: ['ko', 'El enlace de confirmación ha caducado. Intenta iniciar sesión y pulsa "Reenviar correo de confirmación".'],
                    invalido: ['ko', 'El enlace de confirmación no es válido o ya se ha usado.']
                },
                oauth: {
                    cancelado: ['ko', 'Has cancelado el inicio de sesión con Google.'],
                    error: ['ko', 'No se pudo iniciar sesión con Google. Inténtalo de nuevo.']
                }
            };
            const clave = ['confirmacion', 'oauth'].find(k => params.has(k));
            if (!clave) return;
            const opciones = avisos[clave];
            const [tipo, texto] = opciones[params.get(clave)] || Object.values(opciones).at(-1);
            const msg = document.getElementById('confirmacion-msg');
            msg.className = `aviso ${tipo}`;
            msg.textContent = texto;
            msg.style.display = 'block';
            history.replaceState(null, '', '/');
        }

        document.getElementById('google-btn').addEventListener('click', () => {
            RestClient.iniciarLoginGoogle();
        });

        const reenviarBtn = document.getElementById('reenviar-btn');
        reenviarBtn.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const msg = document.getElementById('reenviar-msg');
            try {
                const res = await RestClient.reenviarConfirmacion(email);
                msg.className = 'success';
                msg.textContent = res.mensaje;
            } catch (err) {
                msg.className = 'error';
                msg.textContent = err.message;
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            document.getElementById('login-error').textContent = '';
            document.getElementById('reenviar-msg').textContent = '';
            reenviarBtn.style.display = 'none';
            try {
                const res = await RestClient.login(email, password);
                userEmailSpan.textContent = res.email;
                userRoleSpan.textContent = res.rol;
                if (res.rol === 'admin') {
                    adminSection.style.display = 'block';
                }
                mostrarVista(dashboardView);
            } catch (err) {
                document.getElementById('login-error').textContent = err.message;
                if (err.codigo === 'CUENTA_PENDIENTE') {
                    reenviarBtn.style.display = 'block';
                }
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                const res = await RestClient.registrar(email, password);
                document.getElementById('reg-success').textContent = res.mensaje;
                document.getElementById('reg-error').textContent = '';
            } catch (err) {
                document.getElementById('reg-error').textContent = err.message;
                document.getElementById('reg-success').textContent = '';
            }
        });

        function mostrarMensaje(id, texto, ok) {
            const el = document.getElementById(id);
            el.className = ok ? 'success' : 'error';
            el.textContent = texto;
        }

        // Si el servidor dice que la sesión ya no vale, se vuelve a la pantalla de login
        function sesionPerdida(err) {
            if (err.estado === 401) {
                adminSection.style.display = 'none';
                mostrarVista(authView);
                document.getElementById('login-error').textContent = 'Tu sesión ha caducado. Inicia sesión de nuevo.';
                return true;
            }
            return false;
        }

        // Listado de usuarios (solo admin). Se construye con textContent para no interpretar HTML de los datos.
        async function cargarUsuarios() {
            const contenedor = document.getElementById('users-container');
            try {
                const usuarios = await RestClient.listarUsuarios();
                const tabla = document.createElement('table');
                tabla.innerHTML = '<thead><tr><th>Email</th><th>Rol</th><th>Estado</th><th>Activo</th><th></th></tr></thead>';
                const cuerpo = document.createElement('tbody');
                usuarios.forEach(u => {
                    const fila = document.createElement('tr');
                    [u.email, u.rol, u.estado, u.activo ? 'Sí' : 'No'].forEach(valor => {
                        const celda = document.createElement('td');
                        celda.textContent = valor;
                        fila.appendChild(celda);
                    });
                    const celdaAccion = document.createElement('td');
                    if (u.estado !== 'eliminado' && u.email !== userEmailSpan.textContent) {
                        const boton = document.createElement('button');
                        boton.className = 'btn-danger';
                        boton.style.margin = '0';
                        boton.style.padding = '4px 8px';
                        boton.textContent = 'Eliminar';
                        boton.addEventListener('click', () => eliminarUsuario(u.email));
                        celdaAccion.appendChild(boton);
                    }
                    fila.appendChild(celdaAccion);
                    cuerpo.appendChild(fila);
                });
                tabla.appendChild(cuerpo);
                contenedor.replaceChildren(tabla);
            } catch (err) {
                if (!sesionPerdida(err)) mostrarMensaje('admin-msg', err.message, false);
            }
        }

        async function eliminarUsuario(email) {
            if (!confirm(`¿Seguro que quieres eliminar la cuenta ${email}? No podrá volver a iniciar sesión.`)) return;
            try {
                await RestClient.eliminarUsuario(email);
                mostrarMensaje('admin-msg', `Cuenta ${email} eliminada.`, true);
                await cargarUsuarios();
            } catch (err) {
                if (!sesionPerdida(err)) mostrarMensaje('admin-msg', err.message, false);
            }
        }

        document.getElementById('load-users-btn').addEventListener('click', cargarUsuarios);

        document.getElementById('activo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('activo-email').value;
            try {
                const res = await RestClient.consultarActivo(email);
                mostrarMensaje('activo-resultado', `${res.email}: ${res.activo ? 'ACTIVO' : 'NO activo (pendiente, eliminado o inexistente)'}`, res.activo);
            } catch (err) {
                if (!sesionPerdida(err)) mostrarMensaje('activo-resultado', err.message, false);
            }
        });

        document.getElementById('delete-self-btn').addEventListener('click', async () => {
            const email = userEmailSpan.textContent;
            if (!confirm('¿Seguro que quieres eliminar tu cuenta? Esta acción no se puede deshacer.')) return;
            try {
                await RestClient.eliminarUsuario(email);
                adminSection.style.display = 'none';
                mostrarVista(authView);
                const msg = document.getElementById('confirmacion-msg');
                msg.className = 'aviso ok';
                msg.textContent = 'Tu cuenta se ha eliminado.';
                msg.style.display = 'block';
            } catch (err) {
                if (!sesionPerdida(err)) mostrarMensaje('dashboard-error', err.message, false);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await RestClient.logout();
            } catch {
                // aunque falle la red, se vuelve al login: la cookie caducará sola
            }
            adminSection.style.display = 'none';
            document.getElementById('users-container').replaceChildren();
            mostrarVista(authView);
        });

        mostrarResultadoConfirmacion();
        verificarSesionInicial();
    </script>
</body>
</html>
