<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS - Gestión de Usuarios</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .vista { display: none; }
        .activa { display: block; }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--error-color);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .error { color: var(--error-color); font-size: 0.875rem; margin-top: 8px; }
        .success { color: var(--success-color); font-size: 0.875rem; margin-top: 8px; }

        .divider {
            margin: 24px 0;
            border: none;
            border-top: 1px solid var(--border-color);
        }

        /* Panel de administración y dashboard */
        .dashboard-card {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.875rem;
        }

        th, td {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <header>
        <h1>CloudSaaS Platform</h1>
        <p class="subtitle">Gestión avanzada de usuarios y arquitectura en capas</p>
    </header>

    <div class="container">
        <!-- VISTA DE LOGIN Y REGISTRO -->
        <div id="auth-view" class="vista activa">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit">Entrar a la plataforma</button>
            </form>
            <p id="login-error" class="error"></p>

            <hr class="divider">

            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <p id="reg-error" class="error"></p>
            <p id="reg-success" class="success"></p>
        </div>

        <!-- VISTA DEL PANEL PRIVADO -->
        <div id="dashboard-view" class="vista">
            <h2>Panel de Control</h2>
            <div class="dashboard-card">
                <p><strong>Usuario:</strong> <span id="user-email"></span></p>
                <p><strong>Rol:</strong> <span id="user-role" style="text-transform: uppercase; font-weight: bold; color: var(--primary);"></span></p>
            </div>

            <!-- Sección exclusiva para administradores -->
            <div id="admin-section" style="display: none; margin-top: 20px;">
                <h3>Panel de Administración</h3>
                <button id="load-users-btn" style="background-color: #0284c7;">Listar Usuarios del Sistema</button>
                <div id="users-container" style="overflow-x: auto;"></div>
            </div>

            <button id="logout-btn" class="btn-danger" style="margin-top: 20px;">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Importamos el cliente de comunicación -->
    <script src="rest.js"></script>
    <script>
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const userEmailSpan = document.getElementById('user-email');
        const userRoleSpan = document.getElementById('user-role');
        const adminSection = document.getElementById('admin-section');

        function mostrarVista(vista) {
            authView.classList.remove('activa');
            dashboardView.classList.remove('activa');
            vista.classList.add('activa');
        }

        async function verificarSesionInicial() {
            try {
                const usuario = await RestClient.comprobarSesion();
                if (usuario) {
                    userEmailSpan.textContent = usuario.email;
                    userRoleSpan.textContent = usuario.rol;
                    if (usuario.rol === 'admin') {
                        adminSection.style.display = 'block';
                    }
                    mostrarVista(dashboardView);
                } else {
                    mostrarVista(authView);
                }
            } catch (e) {
                mostrarVista(authView);
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await RestClient.login(email, password);
                userEmailSpan.textContent = res.email;
                userRoleSpan.textContent = res.rol;
                if (res.rol === 'admin') {
                    adminSection.style.display = 'block';
                }
                mostrarVista(dashboardView);
            } catch (err) {
                document.getElementById('login-error').textContent = err.message;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                await RestClient.registrar(email, password);
                document.getElementById('reg-success').textContent = '¡Registro exitoso! Cuenta pendiente de confirmación.';
                document.getElementById('reg-error').textContent = '';
            } catch (err) {
                document.getElementById('reg-error').textContent = err.message;
                document.getElementById('reg-success').textContent = '';
            }
        });

        // Botón para listar usuarios (Solo Admin)
        document.getElementById('load-users-btn')?.addEventListener('click', async () => {
            try {
                const respuesta = await fetch('/api/usuarios');
                if (!respuesta.ok) throw new Error('No autorizado para ver la lista');
                const usuarios = await respuesta.json();
                
                let html = '<table><thead><tr><th>Email</th><th>Rol</th><th>Estado</th></tr></thead><tbody>';
                usuarios.forEach(u => {
                    html += `<tr><td>${u.email}</td><td>${u.rol}</td><td>${u.estado}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('users-container').innerHTML = html;
            } catch (err) {
                alert(err.message);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await RestClient.logout();
            adminSection.style.display = 'none';
            mostrarVista(authView);
        });

        verificarSesionInicial();
    </script>
</body>
</html>
